name: APK de prueba

on:
  push:
    branches: [feature/tenisshore-v1]
    paths:
      - .github/workflows/preview-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/feature/tenisshore-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test && npm run typecheck && npm run lint
      - run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK and native tests
        working-directory: android
        run: ./gradlew :tenisshore-native:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tenisshore-preview-arm64.apk
          sha256sum tenisshore-preview-arm64.apk > tenisshore-preview-arm64.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tenisshore-preview-arm64
          path: |
            tenisshore-preview-arm64.apk
            tenisshore-preview-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 30
